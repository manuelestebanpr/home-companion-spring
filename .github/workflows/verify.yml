name: Verify backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  critical-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home-companion-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: home-companion-backend/pom.xml
      - run: ./mvnw --batch-mode verify spotless:check
