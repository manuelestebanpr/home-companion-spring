spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: home-companion
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/home_companion}
    username: ${DB_USER:home_companion}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  modulith:
    detection-strategy: explicitly-annotated
  ai:
    mcp:
      server:
        name: home-companion
        version: 0.1.0
        # Tools are registered explicitly as specifications, without annotation scanning.
        annotation-scanner:
          enabled: false
        type: SYNC
        protocol: STATELESS
        stateless:
          mcp-endpoint: /mcp
        capabilities:
          resource: false
          prompt: false
          completion: false
  messages:
    basename: messages
    fallback-to-system-locale: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
  tomcat:
    max-http-form-post-size: 64KB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
home:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  origin: ${HOME_ORIGIN:https://home-companion.home.arpa}
