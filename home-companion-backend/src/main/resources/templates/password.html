<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Contraseña')}"></head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <div class="shell">
      <aside th:replace="~{fragments/layout :: sidebar}"></aside>
      <main id="main" class="main">
        <div th:replace="~{fragments/layout :: topbar}"></div>
        <header class="page-head">
          <div>
            <span class="eyebrow">Tu cuenta</span>
            <h1>Una llave propia.</h1>
            <p>Elige una contraseña de al menos 12 caracteres.</p>
          </div>
        </header>
        <aside class="note" th:if="${account.mustChangePassword}">
          Cambia la contraseña inicial antes de continuar.
        </aside>
        <form class="card" method="post" th:action="@{/app/password}">
          <div class="form-grid">
            <label
              >Contraseña actual<input
                type="password"
                name="current"
                required
                autocomplete="current-password" /></label
            ><label
              >Nueva contraseña<input
                type="password"
                name="replacement"
                required
                minlength="12"
                maxlength="72"
                autocomplete="new-password"
            /></label>
          </div>
          <div class="form-actions"><button>Guardar contraseña</button></div>
          <small
            >Las claves y los tokens de teléfono se revocan al cambiar la
            contraseña.</small
          >
        </form>
      </main>
    </div>
  </body>
</html>
